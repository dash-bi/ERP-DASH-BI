<div class="relative w-full overflow-hidden rounded-xl bg-surface-container-low shadow-xl">
<div class="absolute -top-24 -left-24 w-80 h-80 rounded-full bg-primary/10 blur-3xl pointer-events-none" style="background-color: rgba(74, 124, 89, 0.18);"></div>
<div class="absolute -bottom-24 -right-24 w-80 h-80 rounded-full bg-secondary-container/40 blur-3xl pointer-events-none" style="background-color: rgba(196, 166, 106, 0.22);"></div>
<div class="relative w-full backdrop-blur-xl bg-surface-container-lowest/80 p-margin-md sm:p-margin-lg rounded-xl" style="background-color: #ffffff; border: 1px solid #e7e3da; box-shadow: 0 20px 40px -15px rgba(46, 50, 48, 0.07), 0 2px 8px -2px rgba(46, 50, 48, 0.04); border-radius: 16px;">
<div class="flex items-center justify-between mb-space-lg">
<div class="inline-flex items-center gap-space-xs px-2.5 py-1 rounded-full bg-surface-container text-primary text-label-sm font-label-sm" style="background-color: #eaf3ed; color: #2e5c3c; font-weight: 600;">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse" style="background-color: #4a7c59;"></span>
<span>DIAN Habilitado</span>
</div>
<div class="flex items-center gap-space-xs">
<button class="px-2 py-1 rounded text-label-sm font-label-sm text-on-surface-variant hover:bg-surface-container-high transition-colors" id="langToggle" type="button">
            ES · COP
          </button>
<button aria-label="Cambiar tema" class="p-1.5 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors" id="themeToggle" type="button">
<span class="material-symbols-outlined text-[18px]">light_mode</span>
</button>
</div>
</div>
<div class="flex flex-col items-center text-center mb-space-lg">
<div class="h-12 flex items-center justify-center mb-space-sm"><div class="flex items-center justify-center gap-2.5"><div class="w-10 h-10 rounded-xl flex items-center justify-center text-white shadow-sm" style="background: linear-gradient(135deg, #4a7c59, #336140);"><span class="material-symbols-outlined text-[22px]">monitoring</span></div><div class="flex items-baseline gap-1"><span class="text-[24px] font-bold tracking-tight" style="color: #1e3324; font-family: 'Nunito Sans', sans-serif;">ContaPyme</span><span class="text-[11px] font-black uppercase px-1.5 py-0.5 rounded tracking-wider" style="background-color: #eaf3ed; color: #3b6d49;">PRO</span></div></div></div>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-xs">
          Gestión financiera y contable para pymes colombianas
        </p>
</div>
<form class="space-y-space-md" id="loginForm" onsubmit="return false;">
<div class="space-y-space-xs">
<label class="block font-label-md text-label-md text-on-surface">Rol de Operación</label>
<div class="grid grid-cols-3 gap-1.5 p-1 rounded-lg bg-surface-container" style="background-color: #f1ede4; border-radius: 12px; padding: 4px;">
<button class="role-btn py-1.5 px-2 rounded-md font-label-sm text-label-sm transition-all bg-primary-container text-on-primary shadow-sm font-medium" data-role="admin" style="background-color: #4a7c59; color: #ffffff; border-radius: 10px; font-weight: 600;" type="button">
              Administrador
            </button>
<button class="role-btn py-1.5 px-2 rounded-md font-label-sm text-label-sm transition-all text-on-surface-variant hover:text-on-surface font-medium" data-role="contador" type="button">
              Contador
            </button>
<button class="role-btn py-1.5 px-2 rounded-md font-label-sm text-label-sm transition-all text-on-surface-variant hover:text-on-surface font-medium" data-role="vendedor" type="button">
              Vendedor
            </button>
</div>
<input id="selectedRole" type="hidden" value="admin"/>
</div>
<div class="space-y-space-xs">
<label class="block font-label-md text-label-md text-on-surface" for="corporateEmail">Correo Corporativo</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">mail</span>
<input class="w-full h-[38px] pl-10 pr-3 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-colors" id="corporateEmail" placeholder="carlos.restrepo@cafeandino.com.co" style="background-color: #faf8f4; border: 1px solid #dfdad0; border-radius: 12px; color: #2e3230; height: 42px;" type="email" value="carlos.restrepo@cafeandino.com.co"/>
</div>
</div>
<div class="space-y-space-xs">
<div class="flex items-center justify-between">
<label class="block font-label-md text-label-md text-on-surface" for="accountPassword">Contraseña Segura</label>
<a class="font-label-sm text-label-sm text-primary-container hover:underline" href="#" style="color: #4a7c59; font-weight: 600;">¿Olvidó su contraseña?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full h-[38px] pl-10 pr-10 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-colors" id="accountPassword" placeholder="••••••••••••" style="background-color: #faf8f4; border: 1px solid #dfdad0; border-radius: 12px; color: #2e3230; height: 42px;" type="password" value="Finanzas2024*"/>
<button aria-label="Mostrar u ocultar contraseña" class="absolute right-2.5 p-1 rounded text-outline hover:text-on-surface transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[19px]" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-space-xs">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded bg-surface-container-low text-primary-container accent-primary-container cursor-pointer" id="rememberDevice" style="accent-color: #4a7c59;" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant">Recordar mi sesión en este equipo</span>
</label>
</div>
<button class="w-full h-[42px] mt-space-sm rounded-lg bg-primary-container text-on-primary font-label-md text-label-md flex items-center justify-center gap-2 shadow-md hover:opacity-95 active:scale-[0.99] transition-all" id="submitButton" style="background-color: #4a7c59; border-radius: 12px; height: 44px; font-weight: 700; box-shadow: 0 4px 12px rgba(74, 124, 89, 0.28);" type="button">
<span class="material-symbols-outlined text-[20px]">login</span>
<span id="buttonText">Ingresar al Sistema</span>
</button>
</form>
<div class="mt-space-lg pt-space-md border-t border-outline-variant/30 space-y-space-xs">
<div class="flex items-start gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-secondary text-[18px] shrink-0 mt-0.5" style="color: #4a7c59;">verified_user</span>
<p class="font-body-sm text-body-sm leading-tight text-on-surface-variant">
            Software verificado para facturación electrónica DIAN Colombia.
            <span class="font-fiscal-id text-fiscal-id font-medium text-on-surface">NIT 901.458.329-1</span>
</p>
</div>
<div class="flex items-center justify-between text-label-sm font-label-sm text-outline pt-space-xs">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">lock_clock</span>
<span>Cifrado TLS 1.3 bancario</span>
</div>
<a class="hover:underline hover:text-primary-container" href="#" style="color: #4a7c59; font-weight: 600;">Soporte Técnico</a>
</div>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('accountPassword');
    const toggleButton = document.getElementById('togglePassword');
    const passwordIcon = document.getElementById('passwordIcon');
    const roleButtons = document.querySelectorAll('.role-btn');
    const selectedRole = document.getElementById('selectedRole');
    const submitBtn = document.getElementById('submitButton');
    const buttonText = document.getElementById('buttonText');
    const themeToggle = document.getElementById('themeToggle');

    toggleButton.addEventListener('click', function() {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      passwordIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });

    roleButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        roleButtons.forEach(b => {
          b.className = 'role-btn py-1.5 px-2 rounded-md font-label-sm text-label-sm transition-all text-on-surface-variant hover:text-on-surface font-medium';
        });
        this.className = 'role-btn py-1.5 px-2 rounded-md font-label-sm text-label-sm transition-all bg-primary-container text-on-primary shadow-sm font-medium';
        selectedRole.value = this.dataset.role;
      });
    });

    submitBtn.addEventListener('click', function() {
      buttonText.textContent = 'Autenticando en DIAN...';
      submitBtn.classList.add('opacity-80', 'pointer-events-none');

      setTimeout(function() {
        buttonText.textContent = 'Acceso concedido';
        submitBtn.classList.remove('bg-primary-container');
        submitBtn.classList.add('bg-secondary');

        setTimeout(function() {
          buttonText.textContent = 'Ingresar al Sistema';
          submitBtn.classList.remove('bg-secondary', 'opacity-80', 'pointer-events-none');
          submitBtn.classList.add('bg-primary-container');
        }, 1200);
      }, 900);
    });

    let isDark = false;
    themeToggle.addEventListener('click', function() {
      isDark = !isDark;
      document.documentElement.classList.toggle('dark', isDark);
      themeToggle.querySelector('.material-symbols-outlined').textContent = isDark ? 'dark_mode' : 'light_mode';
    });
  })();
</script></main></body></html>
